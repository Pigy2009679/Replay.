name: Build REPLAY Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "REPLAY_GitHub_Starter.zip"
      - ".github/workflows/build-android.yml"
      - "README.md"

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify starter archive
        run: |
          test -f REPLAY_GitHub_Starter.zip || {
            echo "::error::REPLAY_GitHub_Starter.zip was not found in the repository root."
            exit 1
          }
          unzip -t REPLAY_GitHub_Starter.zip

      - name: Extract project
        run: |
          mkdir -p extracted
          unzip -q REPLAY_GitHub_Starter.zip -d extracted
          PUBSPEC="$(find extracted -type f -name pubspec.yaml -print -quit)"
          if [ -z "$PUBSPEC" ]; then
            echo "::error::No pubspec.yaml was found inside the ZIP."
            find extracted -maxdepth 4 -type f -print
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$PUBSPEC")" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          flutter create --platforms=android --org com.replay --project-name app .
          mkdir -p android/app/src/main/kotlin/com/replay/app

          # Restore the app's custom manifest and Kotlin capture sources.
          SOURCE_MANIFEST="$(find android -maxdepth 3 -type f -name AndroidManifest.xml ! -path 'android/app/src/main/AndroidManifest.xml' -print -quit)"
          if [ -n "$SOURCE_MANIFEST" ]; then
            cp "$SOURCE_MANIFEST" android/app/src/main/AndroidManifest.xml
          fi

          while IFS= read -r source; do
            case "$source" in
              android/app/src/main/kotlin/*) ;;
              *) cp "$source" android/app/src/main/kotlin/com/replay/app/ ;;
            esac
          done < <(find android -type f -name '*.kt' ! -path 'android/app/src/main/kotlin/*')

          # FlutterActivity does not expose ComponentActivity's
          # registerForActivityResult API. Use its supported activity callback.
          cat > android/app/src/main/kotlin/com/replay/app/MainActivity.kt <<'KOTLIN'
          package com.replay.app

          import android.app.Activity
          import android.content.Intent
          import android.media.projection.MediaProjectionManager
          import android.os.Build
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterActivity() {
              private val channelName = "com.replay.app/screen_capture"
              private val requestCode = 7412
              private var pendingResult: MethodChannel.Result? = null

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, channelName)
                      .setMethodCallHandler { call, result ->
                          when (call.method) {
                              "startRecording" -> {
                                  if (pendingResult != null) {
                                      result.error("BUSY", "A permission request is already open.", null)
                                      return@setMethodCallHandler
                                  }
                                  val manager = getSystemService(MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                                  pendingResult = result
                                  startActivityForResult(manager.createScreenCaptureIntent(), requestCode)
                              }
                              "pauseRecording" -> sendServiceAction(ReplayCaptureService.ACTION_PAUSE, result)
                              "resumeRecording" -> sendServiceAction(ReplayCaptureService.ACTION_RESUME, result)
                              "stopRecording" -> sendServiceAction(ReplayCaptureService.ACTION_STOP, result)
                              "listRecordings" -> result.success(ReplayCaptureService.listRecordings(this))
                              else -> result.notImplemented()
                          }
                      }
              }

              @Deprecated("Deprecated by Android, retained for FlutterActivity compatibility")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode != this.requestCode) return

                  val callback = pendingResult
                  pendingResult = null
                  if (resultCode == Activity.RESULT_OK && data != null) {
                      val serviceIntent = Intent(this, ReplayCaptureService::class.java).apply {
                          action = ReplayCaptureService.ACTION_START
                          putExtra(ReplayCaptureService.EXTRA_RESULT_CODE, resultCode)
                          putExtra(ReplayCaptureService.EXTRA_DATA, data)
                      }
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          startForegroundService(serviceIntent)
                      } else {
                          startService(serviceIntent)
                      }
                      callback?.success(true)
                  } else {
                      callback?.success(false)
                  }
              }

              private fun sendServiceAction(action: String, result: MethodChannel.Result) {
                  try {
                      startService(Intent(this, ReplayCaptureService::class.java).setAction(action))
                      result.success(null)
                  } catch (e: Exception) {
                      result.error("SERVICE_ERROR", e.message, null)
                  }
              }
          }
          KOTLIN

      - name: Inspect extracted capture sources
        run: |
          cd "$PROJECT_DIR"
          echo "===== lib/main.dart ====="
          sed -n '1,1200p' lib/main.dart
          echo "===== lib/services/screen_capture.dart ====="
          sed -n '1,260p' lib/services/screen_capture.dart
          echo "===== android/MainActivity.kt sources ====="
          find android -type f -name '*.kt' -not -path 'android/app/src/main/kotlin/*' -print -exec sed -n '1,260p' {} \;
          echo "===== android/ReplayCaptureService.kt ====="
          find android -type f -name 'ReplayCaptureService.kt' -print -exec sed -n '1,320p' {} \;

      - name: Get Flutter dependencies
        run: |
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Apply Flutter compatibility fixes
        run: |
          cd "$PROJECT_DIR"
          # Flutter's current ThemeData expects CardThemeData, not CardTheme.
          if [ -f lib/main.dart ]; then
            sed -i 's/CardTheme(/CardThemeData(/g' lib/main.dart
          fi
          # flutter create generates a placeholder test that assumes the
          # generated package name; this starter's package name is different.
          rm -f test/widget_test.dart

      - name: Analyze Dart code
        run: |
          cd "$PROJECT_DIR"
          # Keep real analyzer errors and warnings fatal, but don't fail the
          # build for informational style/deprecation notices.
          flutter analyze --no-fatal-infos

      - name: Build release APK
        run: |
          cd "$PROJECT_DIR"
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: replay-android-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
